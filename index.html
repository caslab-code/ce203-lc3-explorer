<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LC-3 Explorer</title>
<style>
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #f0f2f5;
  --border: #d9dde3;
  --text: #1d2330;
  --muted: #6b7486;
  --accent: #2f6fdf;
  --accent-soft: rgba(47,111,223,.12);
  --err: #c62f3b;
  --err-soft: rgba(198,47,59,.12);
  --warn: #a86a00;
  --warn-soft: rgba(168,106,0,.12);
  --hl-row: rgba(47,111,223,.16);
  /* syntax */
  --s-comment: #7c8597;
  --s-op: #1f5bd0;
  --s-dir: #a3329e;
  --s-reg: #0b7a63;
  --s-num: #b35a00;
  --s-str: #2f8a2f;
  --s-label: #8a4b08;
  --s-trap: #c2185b;
  /* bit-field colours */
  --f-op: #1f5bd0;
  --f-reg: #0b7a63;
  --f-imm: #b35a00;
  --f-off: #a3329e;
  --f-flag: #c2185b;
  --f-zero: #a3abb9;
  --f-data: #1d2330;
  --line-a: 0.10;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181e; --panel: #1c2028; --panel-2: #232833; --border: #313847;
    --text: #dde3ee; --muted: #8b95a8; --accent: #6ea2ff; --accent-soft: rgba(110,162,255,.14);
    --err: #ff6b76; --err-soft: rgba(255,107,118,.14); --warn: #f0b54a; --warn-soft: rgba(240,181,74,.13);
    --hl-row: rgba(110,162,255,.20);
    --s-comment: #6f7a8e; --s-op: #7aa8ff; --s-dir: #e08ae0; --s-reg: #5fd3b3; --s-num: #f5a35c;
    --s-str: #8fd17f; --s-label: #e6c07b; --s-trap: #ff7eb0;
    --f-op: #7aa8ff; --f-reg: #5fd3b3; --f-imm: #f5a35c; --f-off: #e08ae0; --f-flag: #ff7eb0;
    --f-zero: #5b6476; --f-data: #dde3ee; --line-a: 0.13;
  }
}
:root[data-theme="dark"] {
  --bg: #15181e; --panel: #1c2028; --panel-2: #232833; --border: #313847;
  --text: #dde3ee; --muted: #8b95a8; --accent: #6ea2ff; --accent-soft: rgba(110,162,255,.14);
  --err: #ff6b76; --err-soft: rgba(255,107,118,.14); --warn: #f0b54a; --warn-soft: rgba(240,181,74,.13);
  --hl-row: rgba(110,162,255,.20);
  --s-comment: #6f7a8e; --s-op: #7aa8ff; --s-dir: #e08ae0; --s-reg: #5fd3b3; --s-num: #f5a35c;
  --s-str: #8fd17f; --s-label: #e6c07b; --s-trap: #ff7eb0;
  --f-op: #7aa8ff; --f-reg: #5fd3b3; --f-imm: #f5a35c; --f-off: #e08ae0; --f-flag: #ff7eb0;
  --f-zero: #5b6476; --f-data: #dde3ee; --line-a: 0.13;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
.mono, textarea, .code, table.mem, .gutter { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }

/* ---------- top bar ---------- */
header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
}
header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 650; letter-spacing: .2px; }
header h1 span { color: var(--accent); }
header .spacer { flex: 1; }
button, select {
  font: inherit; color: var(--text); background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer;
}
button:hover, select:hover { border-color: var(--accent); }
label.chk { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); cursor: pointer; user-select: none; }
.status { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.status.bad { background: var(--err-soft); color: var(--err); }
.status.warn { background: var(--warn-soft); color: var(--warn); }

/* ---------- main split ---------- */
main { flex: 1; display: flex; min-height: 0; }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); }
#left { flex: 0 0 46%; }
#right { flex: 1; }
.splitter { flex: 0 0 6px; cursor: col-resize; background: var(--border); opacity: .6; }
.splitter:hover, .splitter.drag { background: var(--accent); opacity: 1; }
.pane-head {
  display: flex; align-items: center; gap: 4px; padding: 0 10px; height: 34px; flex: 0 0 34px;
  background: var(--panel-2); border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px;
}
.pane-head .title { font-weight: 600; color: var(--text); margin-right: 8px; }
.tab { border: 0; background: transparent; border-radius: 0; padding: 0 10px; height: 34px; color: var(--muted); border-bottom: 2px solid transparent; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }
.pane-head .spacer { flex: 1; }

/* ---------- editor ---------- */
.editor { flex: 1; display: flex; min-height: 0; position: relative; }
.gutter {
  flex: 0 0 auto; overflow: hidden; background: var(--panel-2); border-right: 1px solid var(--border);
  color: var(--muted); font-size: 13px; line-height: 20px; padding: 8px 0; user-select: none; text-align: right;
}
.gutter .g { height: 20px; display: flex; padding: 0 8px 0 4px; gap: 8px; justify-content: flex-end; white-space: nowrap; }
.gutter .g .ga { color: var(--accent); opacity: .8; min-width: 5ch; text-align: left; }
.gutter .g.err { background: var(--err-soft); color: var(--err); }
.gutter .g.warn { background: var(--warn-soft); color: var(--warn); }
.gutter .g.cur { color: var(--text); }
.ed-wrap { flex: 1; position: relative; overflow: hidden; min-width: 0; }
.code, textarea.src {
  margin: 0; padding: 8px 12px; font-size: 13px; line-height: 20px; tab-size: 8; -moz-tab-size: 8;
  white-space: pre; letter-spacing: 0; font-variant-ligatures: none;
}
.code { position: absolute; top: 0; left: 0; min-width: 100%; pointer-events: none; color: var(--text); }
.code .l { height: 20px; }
.code .l.hl { box-shadow: inset 3px 0 0 var(--accent); background: var(--hl-row) !important; }
.code .l.err { background-image: linear-gradient(var(--err-soft), var(--err-soft)); }
textarea.src {
  position: absolute; inset: 0; width: 100%; height: 100%; resize: none; border: 0; outline: none;
  background: transparent; color: transparent; caret-color: var(--text); overflow: auto;
}
textarea.src::selection { background: rgba(110,140,255,.35); color: transparent; }
.t-c { color: var(--s-comment); font-style: italic; }
.t-op { color: var(--s-op); font-weight: 600; }
.t-dir { color: var(--s-dir); font-weight: 600; }
.t-reg { color: var(--s-reg); }
.t-num { color: var(--s-num); }
.t-str { color: var(--s-str); }
.t-lab { color: var(--s-label); }
.t-trap { color: var(--s-trap); font-weight: 600; }

/* ---------- diagnostics ---------- */
.diag { flex: 0 0 auto; max-height: 30%; overflow: auto; border-top: 1px solid var(--border); background: var(--panel); }
.diag:empty { display: none; }
.diag .d { display: flex; gap: 10px; padding: 4px 12px; cursor: pointer; font-size: 12.5px; border-bottom: 1px solid var(--border); }
.diag .d:hover { background: var(--panel-2); }
.diag .d .k { font-weight: 650; min-width: 54px; }
.diag .d.error .k { color: var(--err); }
.diag .d.warning .k { color: var(--warn); }
.diag .d .ln { color: var(--muted); min-width: 56px; font-family: ui-monospace, Menlo, Consolas, monospace; }

/* ---------- memory view ---------- */
.view { flex: 1; overflow: auto; min-height: 0; }
.view[hidden] { display: none; }
table.mem { border-collapse: collapse; width: 100%; font-size: 13px; }
table.mem th {
  position: sticky; top: 0; z-index: 1; background: var(--panel-2); color: var(--muted); font-weight: 600;
  text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); font-family: system-ui, sans-serif; font-size: 12px; white-space: nowrap;
}
table.mem td { padding: 2px 10px; white-space: nowrap; height: 22px; border-bottom: 1px solid color-mix(in srgb, var(--border) 45%, transparent); }
table.mem tr.row { cursor: pointer; }
table.mem tr.row:hover td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
table.mem tr.row.hl td { background: var(--hl-row) !important; }
table.mem tr.row.hl td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
table.mem tr.seg td {
  background: var(--panel-2); color: var(--muted); font-family: system-ui, sans-serif; font-size: 12px; padding: 5px 10px; font-weight: 600;
}
td.addr { color: var(--accent); }
td.hex { font-weight: 600; }
td.lab { color: var(--s-label); }
td.ins { color: var(--text); }
td.ins .note { color: var(--muted); margin-left: 10px; }
td.lnum { color: var(--muted); text-align: right; }
.bits { letter-spacing: .5px; }
.bits span { padding: 0 1px; border-radius: 3px; }
.bits span + span { margin-left: 5px; }
.f-op { color: var(--f-op); font-weight: 650; }
.f-reg { color: var(--f-reg); }
.f-imm { color: var(--f-imm); }
.f-off { color: var(--f-off); }
.f-flag { color: var(--f-flag); }
.f-zero { color: var(--f-zero); }
.f-data { color: var(--f-data); }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 6px 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); background: var(--panel); }
.legend b { font-weight: 600; font-family: ui-monospace, Menlo, Consolas, monospace; }

/* symbols / output */
table.sym { border-collapse: collapse; font-size: 13px; margin: 0; min-width: 320px; }
table.sym th, table.sym td { padding: 4px 14px; text-align: left; border-bottom: 1px solid var(--border); }
table.sym th { color: var(--muted); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--panel-2); }
table.sym td { font-family: ui-monospace, Menlo, Consolas, monospace; }
table.sym tr { cursor: pointer; }
table.sym tr:hover td { background: var(--panel-2); }
.outbox { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.outbox .row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.outbox pre { margin: 0; padding: 10px 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; overflow: auto; font-size: 12.5px; line-height: 1.5; max-height: 60vh; }
.outbox p { margin: 0; color: var(--muted); }

/* tooltip */
#tip {
  position: fixed; z-index: 10; pointer-events: none; display: none; max-width: 360px;
  background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 6px 24px rgba(0,0,0,.18); padding: 8px 10px; font-size: 12px;
}
#tip table { border-collapse: collapse; font-family: ui-monospace, Menlo, Consolas, monospace; }
#tip td { padding: 1px 8px 1px 0; }
#tip .h { font-weight: 650; margin-bottom: 4px; font-family: ui-monospace, Menlo, Consolas, monospace; }

@media (max-width: 760px) {
  body { overflow: auto; }
  main { flex-direction: column; }
  #left { flex: 0 0 55vh; }
  #right { flex: 0 0 70vh; }
  .splitter { display: none; }
  header { padding: 8px 16px; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>LC-3 <span>Explorer</span></h1>
  <select id="examples" title="Load an example program">
    <option value="">Examples…</option>
  </select>
  <label class="chk" title="Colour each source line and the memory words it produces"><input type="checkbox" id="optColor" checked> Line colours</label>
  <span class="spacer"></span>
  <span id="status" class="status">ready</span>
  <button id="btnShare" title="Copy a link that contains this source">Share link</button>
  <button id="btnTheme" title="Toggle light / dark">◐</button>
</header>

<main>
  <section class="pane" id="left">
    <div class="pane-head"><span class="title">Source</span><span class="hide-sm">LC-3 assembly</span><span class="spacer"></span><span id="cursorPos" class="mono"></span></div>
    <div class="editor">
      <div class="gutter" id="gutter"></div>
      <div class="ed-wrap" id="edWrap">
        <div class="code" id="code" aria-hidden="true"></div>
        <textarea class="src" id="src" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="LC-3 assembly source"></textarea>
      </div>
    </div>
    <div class="diag" id="diag"></div>
  </section>
  <div class="splitter" id="splitter" title="Drag to resize"></div>
  <section class="pane" id="right">
    <div class="pane-head">
      <button class="tab on" data-view="vMem">Memory</button>
      <button class="tab" data-view="vSym">Symbols</button>
      <button class="tab" data-view="vOut">Output</button>
      <span class="spacer"></span>
      <label class="chk hide-sm"><input type="checkbox" id="optBin" checked> Binary</label>
      <label class="chk hide-sm"><input type="checkbox" id="optDec"> Decimal</label>
    </div>
    <div class="view" id="vMem"></div>
    <div class="view" id="vSym" hidden></div>
    <div class="view" id="vOut" hidden></div>
    <div class="legend" id="legend">
      <span><b class="f-op">opcode</b></span><span><b class="f-reg">register</b></span><span><b class="f-imm">imm / trapvect</b></span>
      <span><b class="f-off">PC/base offset</b></span><span><b class="f-flag">flag / nzp</b></span><span><b class="f-zero">fixed</b></span><span><b class="f-data">data</b></span>
    </div>
  </section>
</main>
<div id="tip"></div>

<!-- ===================== LC-3 assembler core (no DOM) ===================== -->
<script id="lc3-core">
"use strict";
var LC3 = (function () {
  var OPCODES = {
    ADD:1, AND:1, NOT:1, JMP:1, JSR:1, JSRR:1, LD:1, LDI:1, LDR:1, LEA:1,
    ST:1, STI:1, STR:1, TRAP:1, RTI:1, RET:1
  };
  var TRAPS = { GETC: 0x20, OUT: 0x21, PUTS: 0x22, IN: 0x23, PUTSP: 0x24, HALT: 0x25 };
  var DIRECTIVES = { ".ORIG":1, ".END":1, ".FILL":1, ".BLKW":1, ".STRINGZ":1 };
  var BR_RE = /^BR([NZP]{0,3})$/;

  function isBranch(u) {
    var m = BR_RE.exec(u);
    if (!m) return false;
    var s = m[1];
    return !/(.).*\1/.test(s); // no repeated flag letters
  }
  function isMnemonic(tok) {
    var u = tok.toUpperCase();
    return !!(OPCODES[u] || TRAPS.hasOwnProperty(u) || DIRECTIVES[u] || isBranch(u));
  }

  // number literal: #10  #-5  x3000  X-1  0x1F  b1010  10  -3
  function parseNum(t) {
    var m;
    if ((m = /^#([+-]?\d+)$/.exec(t))) return parseInt(m[1], 10);
    if ((m = /^#?0?[xX]([+-]?)([0-9a-fA-F]+)$/.exec(t))) { var v = parseInt(m[2], 16); return m[1] === "-" ? -v : v; }
    if ((m = /^#?[bB]([+-]?)([01]+)$/.exec(t))) { var b = parseInt(m[2], 2); return m[1] === "-" ? -b : b; }
    if ((m = /^[+-]?\d+$/.exec(t))) return parseInt(t, 10);
    return null;
  }
  function parseReg(t) {
    var m = /^[rR]([0-7])$/.exec(t);
    return m ? +m[1] : null;
  }

  // Split one source line into tokens (strings kept whole) and a comment.
  function tokenize(line) {
    var toks = [], i = 0, n = line.length, comment = null, err = null;
    while (i < n) {
      var c = line[i];
      if (c === ";") { comment = line.slice(i); break; }
      if (c === " " || c === "\t" || c === "," || c === "\r") { i++; continue; }
      var start = i;
      if (c === '"') {
        var s = "", closed = false; i++;
        while (i < n) {
          var d = line[i];
          if (d === "\\" && i + 1 < n) {
            var e = line[i + 1];
            s += ({ n: "\n", t: "\t", r: "\r", "0": "\0", "\\": "\\", '"': '"', a: "\x07", e: "\x1b" })[e] !== undefined
              ? ({ n: "\n", t: "\t", r: "\r", "0": "\0", "\\": "\\", '"': '"', a: "\x07", e: "\x1b" })[e] : e;
            i += 2; continue;
          }
          if (d === '"') { closed = true; i++; break; }
          s += d; i++;
        }
        if (!closed) err = "Unterminated string literal";
        toks.push({ text: line.slice(start, i), str: s, col: start, isStr: true });
        continue;
      }
      while (i < n && !/[\s,;"]/.test(line[i])) i++;
      toks.push({ text: line.slice(start, i), col: start });
    }
    return { toks: toks, comment: comment, err: err };
  }

  function hex4(v) { return "x" + ((v & 0xFFFF) >>> 0).toString(16).toUpperCase().padStart(4, "0"); }

  // operand spec per mnemonic: list of kinds
  function spec(u) {
    if (isBranch(u)) return ["label"];
    switch (u) {
      case "ADD": case "AND": return ["reg", "reg", "regimm"];
      case "NOT": return ["reg", "reg"];
      case "JMP": case "JSRR": return ["reg"];
      case "JSR": return ["label"];
      case "LD": case "LDI": case "LEA": case "ST": case "STI": return ["reg", "label"];
      case "LDR": case "STR": return ["reg", "reg", "num"];
      case "TRAP": return ["num"];
      case "RET": case "RTI": return [];
    }
    if (TRAPS.hasOwnProperty(u)) return [];
    return null;
  }

  function assemble(source) {
    var lines = source.split("\n");
    var diags = [];
    function error(line, msg) { diags.push({ line: line, sev: "error", msg: msg }); }
    function warn(line, msg) { diags.push({ line: line, sev: "warning", msg: msg }); }

    // ---------- pass 1: parse + lay out addresses ----------
    var stmts = [];          // parsed statements
    var symbols = {};        // NAME(upper) -> {name, addr, line}
    var symOrder = [];
    var lc = null, inSeg = false, seenEnd = false, segCount = 0;
    var lineAddr = new Array(lines.length).fill(null);
    var pendingLabels = [];  // labels on their own line waiting for the next address

    function defineLabel(tok, ln, addr) {
      var name = tok.replace(/:$/, "");
      if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) { error(ln, "Invalid label name '" + name + "'"); return; }
      if (parseReg(name) !== null) { error(ln, "'" + name + "' is a register name and cannot be a label"); return; }
      if (parseNum(name) !== null) { warn(ln, "Label '" + name + "' looks like a number literal"); }
      var key = name.toUpperCase();
      if (symbols[key]) { error(ln, "Label '" + name + "' already defined on line " + (symbols[key].line + 1)); return; }
      symbols[key] = { name: name, addr: addr, line: ln };
      symOrder.push(key);
    }

    for (var ln = 0; ln < lines.length; ln++) {
      var tk = tokenize(lines[ln]);
      if (tk.err) error(ln, tk.err);
      var toks = tk.toks;
      if (!toks.length) continue;

      var label = null, idx = 0;
      if (!toks[0].isStr && !isMnemonic(toks[0].text)) { label = toks[0].text; idx = 1; }
      var mnTok = toks[idx];
      var mn = mnTok ? mnTok.text.toUpperCase() : null;
      if (mnTok && (mnTok.isStr || !isMnemonic(mnTok.text))) {
        // "MOV R1, R2": the first word was taken as a label, but the next token is clearly an operand
        var looksOperand = mnTok.isStr || parseReg(mnTok.text) !== null || parseNum(mnTok.text) !== null;
        var bad = label && looksOperand ? label : mnTok.text;
        error(ln, "Unknown instruction or directive '" + bad + "'");
        continue;
      }
      var ops = toks.slice(idx + 1);

      if (mn === ".ORIG") {
        if (label) error(ln, "A label cannot be placed on .ORIG");
        if (inSeg) error(ln, ".ORIG inside a block that was not closed with .END");
        var v = ops.length ? parseNum(ops[0].text) : null;
        if (ops.length !== 1 || v === null) { error(ln, ".ORIG needs one numeric address, e.g. .ORIG x3000"); v = 0x3000; }
        if (v < 0 || v > 0xFFFF) { error(ln, ".ORIG address out of range"); v &= 0xFFFF; }
        lc = v; inSeg = true; segCount++;
        stmts.push({ line: ln, mn: ".ORIG", ops: ops, addr: v, size: 0, seg: segCount });
        continue;
      }
      if (mn === ".END") {
        if (label) error(ln, "A label cannot be placed on .END");
        if (!inSeg) error(ln, ".END without a matching .ORIG");
        if (ops.length) warn(ln, "Operands after .END are ignored");
        inSeg = false; seenEnd = true;
        pendingLabels.forEach(function (p) { warn(p.line, "Label '" + p.name + "' is at the end of the block and points past the last word"); });
        pendingLabels = [];
        continue;
      }
      if (!inSeg) {
        error(ln, seenEnd ? "Code after .END (start a new block with .ORIG)" : "Code before .ORIG (add e.g. .ORIG x3000 first)");
        continue;
      }
      if (label) defineLabel(label, ln, lc);
      if (!mn) { continue; } // label only line: label binds to current lc
      var size = 1;
      if (mn === ".BLKW") {
        var n = ops.length ? parseNum(ops[0].text) : null;
        if (n === null || ops.length < 1) { error(ln, ".BLKW needs a count, e.g. .BLKW #10"); n = 1; }
        else if (n < 1) { error(ln, ".BLKW count must be at least 1"); n = 1; }
        if (ops.length > 2) error(ln, ".BLKW takes a count and optional fill value");

<script>

      var cls = "l" + (i === hlLine ? " hl" : "") + (errLines[i] ? " err" : "");
      h += '<div class="' + cls + '" style="' + lineBg(i) + '">' + highlightLine(lines[i]) + "</div>";
      var a = result && result.lineAddr[i] !== null && result.lineAddr[i] !== undefined ? LC3.hex4(result.lineAddr[i]) : "";
      g += '<div class="g' + (errLines[i] ? " err" : warnLines[i] ? " warn" : "") + (i === hlLine ? " cur" : "") + '"><span>' + (i + 1) + '</span><span class="ga">' + a + "</span></div>";
    }
    code.innerHTML = h;
    gutter.innerHTML = g;
    syncScroll();
  }
  function syncScroll() {
    code.style.transform = "translate(" + (-src.scrollLeft) + "px," + (-src.scrollTop) + "px)";
    gutter.scrollTop = src.scrollTop;
  }
  src.addEventListener("scroll", syncScroll);

  // ---------- memory table ----------
  function binHTML(w) {
    var bits = w.value.toString(2).padStart(16, "0"), pos = 0, h = "";
    w.fields.forEach(function (f) {
      var chunk = bits.substr(pos, f[0]); pos += f[0];
      if (f[1] === "data") chunk = chunk.replace(/(.{4})(?=.)/g, "$1 ");
      h += '<span class="f-' + f[1] + '">' + chunk + "</span>";
    });
    return '<span class="bits">' + h + "</span>";
  }
  function signed(v) { return v & 0x8000 ? v - 0x10000 : v; }

  function renderMemory() {
    if (!result || !result.words.length) {
      vMem.innerHTML = '<div class="empty">' + (result && result.errors ? "Fix the errors on the left to see the memory image." : "Write some LC-3 assembly on the left, starting with <span class=mono>.ORIG x3000</span>.") + "</div>";
      return;
    }
    var showBin = $("optBin").checked, showDec = $("optDec").checked;
    var h = '<table class="mem"><thead><tr><th>Address</th><th>Hex</th>' + (showBin ? "<th>Binary</th>" : "") + (showDec ? "<th>Dec</th>" : "") + "<th>Label</th><th>Contents</th><th style='text-align:right'>Line</th></tr></thead><tbody>";
    var colspan = 5 + (showBin ? 1 : 0) + (showDec ? 1 : 0);
    result.segments.forEach(function (seg, si) {
      var end = seg.words.length ? (seg.start + seg.words.length - 1) & 0xFFFF : seg.start;
      h += '<tr class="seg"><td colspan="' + colspan + '">.ORIG ' + LC3.hex4(seg.start) + " &nbsp;·&nbsp; " + seg.words.length + " word" + (seg.words.length === 1 ? "" : "s") + (seg.words.length ? " &nbsp;·&nbsp; " + LC3.hex4(seg.start) + "–" + LC3.hex4(end) : "") + "</td></tr>";
      var ws = seg.words;
      for (var i = 0; i < ws.length; i++) {
        var w = ws[i];
        // collapse long .BLKW runs
        if (w.kind === "blkw") {
          var j = i; while (j + 1 < ws.length && ws[j + 1].line === w.line) j++;
          var cnt = j - i + 1;
          if (cnt > 6) {
            h += rowHTML(w, showBin, showDec, i);
            h += '<tr class="row" data-line="' + w.line + '" data-i="' + (i + 1) + '" style="' + lineBg(w.line) + '"><td class="addr">' + LC3.hex4(ws[i + 1].addr) + "–" + LC3.hex4(ws[j].addr).slice(1) + '</td><td class="hex" colspan="' + (1 + (showBin ? 1 : 0) + (showDec ? 1 : 0)) + '" style="color:var(--muted)">… ' + (cnt - 1) + " more words of " + LC3.hex4(w.value) + '</td><td></td><td></td><td class="lnum">' + (w.line + 1) + "</td></tr>";
            i = j; continue;
          }
        }
        h += rowHTML(w, showBin, showDec, i);
      }
    });
    h += "</tbody></table>";
    vMem.innerHTML = h;
    // index for tooltips
    vMem._words = result.words;
    applyRowHighlight(false);
  }
  function rowHTML(w, showBin, showDec) {
    var idx = w.idx;
    return '<tr class="row" data-line="' + w.line + '" data-w="' + idx + '" style="' + lineBg(w.line) + '">' +
      '<td class="addr">' + LC3.hex4(w.addr) + "</td>" +
      '<td class="hex">' + LC3.hex4(w.value) + "</td>" +
      (showBin ? "<td>" + binHTML(w) + "</td>" : "") +
      (showDec ? '<td class="mono">' + signed(w.value) + "</td>" : "") +
      '<td class="lab">' + (w.label ? esc(w.label) : "") + "</td>" +
      '<td class="ins">' + esc(w.text) + (w.note ? '<span class="note">' + esc(w.note) + "</span>" : "") + "</td>" +
      '<td class="lnum">' + (w.line + 1) + "</td></tr>";
  }

  function renderSymbols() {
    if (!result || !result.symbols.length) { vSym.innerHTML = '<div class="empty">No labels defined.</div>'; return; }
    var h = '<table class="sym"><thead><tr><th>Label</th><th>Address</th><th>Line</th></tr></thead><tbody>';
    result.symbols.slice().sort(function (a, b) { return a.addr - b.addr; }).forEach(function (s) {
      h += '<tr data-line="' + s.line + '"><td style="color:var(--s-label)">' + esc(s.name) + '</td><td style="color:var(--accent)">' + LC3.hex4(s.addr) + "</td><td>" + (s.line + 1) + "</td></tr>";
    });
    vSym.innerHTML = h + "</tbody></table>";
  }

  function hexListing() {
    return result.segments.map(function (seg) {
      return "; segment " + LC3.hex4(seg.start) + "\n" + [seg.start].concat(seg.words.map(function (w) { return w.value; }))
        .map(function (v) { return v.toString(16).toUpperCase().padStart(4, "0"); }).join("\n");
    }).join("\n\n");
  }
  function binListing() {
    return result.segments.map(function (seg) {
      return [seg.start].concat(seg.words.map(function (w) { return w.value; })).map(function (v) { return v.toString(2).padStart(16, "0"); }).join("\n");
    }).join("\n\n");
  }
  function symListing() {
    return "// Symbol table\n// Scope level 0:\n//\tSymbol Name       Page Address\n//\t----------------  ------------\n" +
      result.symbols.map(function (s) { return "//\t" + s.name.padEnd(16) + "  " + s.addr.toString(16).toUpperCase().padStart(4, "0"); }).join("\n") + "\n";
  }

  function renderOutput() {
    if (!result || !result.words.length || result.errors) {
      vOut.innerHTML = '<div class="empty">' + (result && result.errors ? "Output is available once the program assembles without errors." : "Nothing assembled yet.") + "</div>";
      return;
    }
    var multi = result.segments.length > 1;
    vOut.innerHTML = '<div class="outbox">' +
      '<div class="row2"><button data-dl="obj">Download .obj</button><button data-dl="hex">Download .hex</button><button data-dl="bin">Download .bin</button><button data-dl="sym">Download .sym</button><button data-copy="hex">Copy hex</button></div>' +
      "<p>The .obj file is big-endian 16-bit words, first word = origin" + (multi ? " (one .obj per .ORIG block)" : "") + ".</p>" +
      "<pre>" + esc(hexListing()) + "</pre></div>";
  }

  vOut.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || !result) return;
    if (b.dataset.copy) { copy(hexListing(), b); return; }
    var kind = b.dataset.dl;
    if (kind === "obj") result.segments.forEach(function (seg) {
      download(new Blob([LC3.objBytes(seg)], { type: "application/octet-stream" }), "program" + (result.segments.length > 1 ? "_" + LC3.hex4(seg.start) : "") + ".obj");
    });
    if (kind === "hex") download(new Blob([hexListing() + "\n"], { type: "text/plain" }), "program.hex");
    if (kind === "bin") download(new Blob([binListing() + "\n"], { type: "text/plain" }), "program.bin");
    if (kind === "sym") download(new Blob([symListing()], { type: "text/plain" }), "program.sym");
  });
  function download(blob, name) {
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function copy(text, btn) {
    var done = function () { var t = btn.textContent; btn.textContent = "Copied ✓"; setTimeout(function () { btn.textContent = t; }, 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    else { fallbackCopy(text); done(); }
  }
  function fallbackCopy(text) { var t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); } catch (e) {} t.remove(); }

  function renderDiags() {
    if (!result || !result.diags.length) { diagEl.innerHTML = ""; return; }
    diagEl.innerHTML = result.diags.map(function (d) {
      return '<div class="d ' + d.sev + '" data-line="' + d.line + '"><span class="k">' + d.sev + '</span><span class="ln">line ' + (d.line + 1) + "</span><span>" + esc(d.msg) + "</span></div>";
    }).join("");
  }
  function renderStatus() {
    if (!result) return;
    var e = result.errors, w = result.warnings;
    statusEl.className = "status" + (e ? " bad" : w ? " warn" : "");
    statusEl.textContent = e ? e + " error" + (e > 1 ? "s" : "") + (w ? ", " + w + " warning" + (w > 1 ? "s" : "") : "")
      : result.words.length + " words assembled" + (w ? " · " + w + " warning" + (w > 1 ? "s" : "") : "");
  }

  function render() { renderEditor(); renderMemory(); renderSymbols(); renderOutput(); renderDiags(); renderStatus(); }

  // ---------- assemble (debounced) ----------
  var timer = null;
  function run() { result = LC3.assemble(src.value); render(); store("src", src.value); }
  function schedule() { clearTimeout(timer); renderEditor(); timer = setTimeout(run, 150); }
  src.addEventListener("input", schedule);

  function setSource(text) { src.value = text; src.scrollTop = 0; hlLine = -1; run(); }

  // ---------- editor keys ----------
  src.addEventListener("keydown", function (e) {
    if (e.key === "Tab" && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      var s = src.selectionStart, en = src.selectionEnd, v = src.value;
      if (s === en && !e.shiftKey) {
        // insert spaces to next 8-column stop
        var col = s - (v.lastIndexOf("\n", s - 1) + 1), pad = 8 - (col % 8);
        insertText(" ".repeat(pad));
      } else {
        var ls = v.lastIndexOf("\n", s - 1) + 1, block = v.slice(ls, en);
        var nb = e.shiftKey ? block.replace(/^( {1,8}|\t)/gm, "") : block.replace(/^/gm, "        ");
        src.setSelectionRange(ls, en); insertText(nb);
        src.setSelectionRange(ls, ls + nb.length);
      }
    }
  });
  function insertText(t) {
    if (!document.execCommand || !document.execCommand("insertText", false, t)) {
      var s = src.selectionStart; src.setRangeText(t, s, src.selectionEnd, "end"); schedule();
    }
  }

  // ---------- cross-highlighting ----------
  function currentLine() { return src.value.slice(0, src.selectionStart).split("\n").length - 1; }
  function updateCursor() {
    var ln = currentLine(), col = src.selectionStart - (src.value.lastIndexOf("\n", src.selectionStart - 1) + 1);
    $("cursorPos").textContent = "Ln " + (ln + 1) + ", Col " + (col + 1);
    if (ln !== hlLine) { hlLine = ln; renderEditor(); applyRowHighlight(true); }
  }
  ["keyup", "click", "focus", "select"].forEach(function (ev) { src.addEventListener(ev, updateCursor); });
  document.addEventListener("selectionchange", function () { if (document.activeElement === src) updateCursor(); });

  function applyRowHighlight(scroll) {
    var first = null;
    vMem.querySelectorAll("tr.row").forEach(function (tr) {
      var on = +tr.dataset.line === hlLine;
      tr.classList.toggle("hl", on);
      if (on && !first) first = tr;
    });
    if (scroll && first && !vMem.hidden) {
      var r = first.getBoundingClientRect(), vr = vMem.getBoundingClientRect();
      if (r.top < vr.top + 30 || r.bottom > vr.bottom) vMem.scrollTop += r.top - vr.top - vr.height / 3;
    }
  }

  function gotoLine(ln) {
    var lines = src.value.split("\n"), pos = 0;
    for (var i = 0; i < ln && i < lines.length; i++) pos += lines[i].length + 1;
    src.focus({ preventScroll: true });
    src.setSelectionRange(pos, pos);
    var top = ln * 20, h = src.clientHeight;
    if (top < src.scrollTop || top > src.scrollTop + h - 40) src.scrollTop = Math.max(0, top - h / 3);
    syncScroll(); updateCursor();
  }
  [vMem, vSym, diagEl].forEach(function (el) {
    el.addEventListener("click", function (e) {
      var t = e.target.closest("[data-line]"); if (t) gotoLine(+t.dataset.line);
    });
  });

  // hovering a memory row lights up its source line
  vMem.addEventListener("mouseover", function (e) {
    var tr = e.target.closest("tr.row");
    code.querySelectorAll(".l.peek").forEach(function (l) { l.classList.remove("peek", "hl"); });
    if (!tr) return;
    var l = code.children[+tr.dataset.line];
    if (l && !l.classList.contains("hl")) l.classList.add("peek", "hl");
  });
  vMem.addEventListener("mouseleave", function () { code.querySelectorAll(".l.peek").forEach(function (l) { l.classList.remove("peek", "hl"); }); tip.style.display = "none"; });

  // bit-field tooltip
  vMem.addEventListener("mousemove", function (e) {
    var bits = e.target.closest(".bits"), tr = e.target.closest("tr.row");
    if (!bits || !tr || tr.dataset.w === undefined) { tip.style.display = "none"; return; }
    var w = result.words[+tr.dataset.w]; if (!w) return;
    var bstr = w.value.toString(2).padStart(16, "0"), pos = 0, hi = 15, rows = "";
    w.fields.forEach(function (f) {
      var lo = hi - f[0] + 1;
      rows += '<tr><td class="f-' + f[1] + '">' + bstr.substr(pos, f[0]) + '</td><td style="color:var(--muted)">[' + (f[0] > 1 ? hi + ":" + lo : hi) + "]</td><td>" + esc(f[2]) + "</td></tr>";
      pos += f[0]; hi = lo - 1;
    });
    var extra = w.kind === "ins" ? "" : '<tr><td colspan="3" style="color:var(--muted)">unsigned ' + w.value + " · signed " + signed(w.value) + "</td></tr>";
    tip.innerHTML = '<div class="h">' + LC3.hex4(w.addr) + ": " + LC3.hex4(w.value) + "  " + esc(w.text || "") + "</div><table>" + rows + extra + "</table>";
    tip.style.display = "block";
    var x = e.clientX + 14, y = e.clientY + 16, tw = tip.offsetWidth, th = tip.offsetHeight;
    if (x + tw > innerWidth - 8) x = e.clientX - tw - 14;
    if (y + th > innerHeight - 8) y = e.clientY - th - 12;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
  });

  // ---------- share link ----------
  $("btnShare").onclick = function () {
    var url = location.href.split("#")[0] + "#src=" + b64encode(src.value);
    try { history.replaceState(null, "", url); } catch (e) {}
    copy(url, $("btnShare"));
  };

  // ---------- init ----------
  var initial = null;
  var m = /#src=([A-Za-z0-9_-]+)/.exec(location.hash);
  if (m) { try { initial = b64decode(m[1]); } catch (e) {} }
  if (initial === null) initial = load("src");
  if (initial === null || !initial.trim()) initial = EXAMPLES["Multiply (loop)"].join("\n") + "\n";
  setSource(initial);
  updateCursor();
})();
</script>
</body>
</html>
